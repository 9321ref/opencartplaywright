name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Node.js 24 geçişini tetiklemek için env ekledik
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # LTS artık Node 22/24 civarında olduğu için sabit bir versiyon kullanmak daha güvenlidir
          node-version: '22' 
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        # Windows'ta bağımlılıkların hatasız kurulması için:
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:sanity
        # Testlerin hata alması durumunda raporun oluşturulması için ortam değişkenleri
        env:
          CI: true

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30